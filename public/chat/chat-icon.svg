<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 200 200"
  width="200"
  height="200"
  fill="none"
>
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#0B2D52"/>
      <stop offset="65%" stop-color="#061B33"/>
      <stop offset="100%" stop-color="#03111F"/>
    </radialGradient>

    <linearGradient id="neonBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7DEBFF"/>
      <stop offset="45%" stop-color="#35B9FF"/>
      <stop offset="100%" stop-color="#2176FF"/>
    </linearGradient>

    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
  </defs>

  <style>
    .orbit-a {
      transform-origin: 100px 100px;
      animation: rotateA 9s linear infinite;
    }

    .orbit-b {
      transform-origin: 100px 100px;
      animation: rotateB 13s linear infinite reverse;
    }

    .orbit-c {
      transform-origin: 100px 100px;
      animation: rotateA 18s linear infinite;
    }

    .dash-ring {
      stroke-dasharray: 5 9;
      animation: dashFlow 8s linear infinite;
    }

    .dash-ring-reverse {
      stroke-dasharray: 3 7;
      animation: dashFlowReverse 10s linear infinite;
    }

    .pulse {
      animation: pulse 2.4s ease-in-out infinite;
      transform-origin: center;
    }

    .pulse-delayed {
      animation: pulse 2.4s ease-in-out infinite .7s;
      transform-origin: center;
    }

    .chat-dot-1 { animation: chatPulse 1.5s ease-in-out infinite; }
    .chat-dot-2 { animation: chatPulse 1.5s ease-in-out .2s infinite; }
    .chat-dot-3 { animation: chatPulse 1.5s ease-in-out .4s infinite; }

    .scan {
      animation: scan 3.5s ease-in-out infinite;
    }

    @keyframes rotateA {
      to { transform: rotate(360deg); }
    }

    @keyframes rotateB {
      to { transform: rotate(-360deg); }
    }

    @keyframes dashFlow {
      to { stroke-dashoffset: -56; }
    }

    @keyframes dashFlowReverse {
      to { stroke-dashoffset: 50; }
    }

    @keyframes pulse {
      0%, 100% {
        opacity: .55;
        transform: scale(.92);
      }
      50% {
        opacity: 1;
        transform: scale(1.12);
      }
    }

    @keyframes chatPulse {
      0%, 100% {
        opacity: .35;
      }
      50% {
        opacity: 1;
      }
    }

    @keyframes scan {
      0%, 100% {
        opacity: .1;
        transform: translateY(-18px);
      }
      50% {
        opacity: .65;
        transform: translateY(18px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
      }
    }
  </style>

  <!-- faint outer technical ring -->
  <circle
    cx="100"
    cy="100"
    r="78"
    stroke="#1476C7"
    stroke-width="1"
    opacity=".18"
  />

  <circle
    class="dash-ring"
    cx="100"
    cy="100"
    r="69"
    stroke="#36B7FF"
    stroke-width="1"
    opacity=".5"
  />

  <!-- crosshair -->
  <g opacity=".28">
    <line x1="100" y1="9" x2="100" y2="39" stroke="#42BAFF"/>
    <line x1="100" y1="161" x2="100" y2="191" stroke="#42BAFF"/>
    <line x1="9" y1="100" x2="39" y2="100" stroke="#42BAFF"/>
    <line x1="161" y1="100" x2="191" y2="100" stroke="#42BAFF"/>
  </g>

  <!-- rotating elliptical orbit -->
  <g class="orbit-a">
    <ellipse
      cx="100"
      cy="100"
      rx="76"
      ry="43"
      transform="rotate(-22 100 100)"
      stroke="url(#neonBlue)"
      stroke-width="1.6"
      opacity=".85"
    />

    <circle
      class="pulse"
      cx="29"
      cy="87"
      r="4"
      fill="#7DEBFF"
      filter="url(#glow)"
    />

    <circle
      cx="166"
      cy="76"
      r="2.7"
      fill="#49D7FF"
      filter="url(#glow)"
    />
  </g>

  <!-- second moving orbit -->
  <g class="orbit-b">
    <ellipse
      cx="100"
      cy="100"
      rx="72"
      ry="52"
      transform="rotate(34 100 100)"
      stroke="#2C91FF"
      stroke-width="1.25"
      opacity=".58"
    />

    <circle
      class="pulse-delayed"
      cx="49"
      cy="57"
      r="3.2"
      fill="#69E7FF"
      filter="url(#glow)"
    />

    <circle
      cx="153"
      cy="143"
      r="3.2"
      fill="#3FBFFF"
      filter="url(#glow)"
    />
  </g>

  <!-- small data orbit -->
  <g class="orbit-c">
    <circle
      class="dash-ring-reverse"
      cx="100"
      cy="100"
      r="57"
      stroke="#448FFF"
      stroke-width=".8"
      opacity=".4"
    />

    <circle
      cx="100"
      cy="43"
      r="2"
      fill="#6EE7FF"
      filter="url(#glow)"
    />
  </g>

  <!-- central sphere -->
  <circle
    cx="100"
    cy="100"
    r="49"
    fill="url(#coreGlow)"
    stroke="#46BEFF"
    stroke-width="1.3"
    filter="url(#softGlow)"
  />

  <!-- inner globe mesh -->
  <g opacity=".19" stroke="#53BBFF" stroke-width=".6">
    <ellipse cx="100" cy="100" rx="38" ry="49"/>
    <ellipse cx="100" cy="100" rx="19" ry="49"/>
    <ellipse cx="100" cy="100" rx="49" ry="20"/>
    <ellipse cx="100" cy="100" rx="49" ry="37"/>
  </g>

  <!-- scan line -->
  <rect
    class="scan"
    x="57"
    y="98"
    width="86"
    height="2"
    rx="1"
    fill="#54CBFF"
    opacity=".18"
    filter="url(#softGlow)"
  />

  <!-- chat icon -->
  <g filter="url(#glow)">
    <path
      d="
        M74 81
        C74 73 80 68 88 68
        H113
        C121 68 127 74 127 82
        V106
        C127 114 121 119 113 119
        H93
        L80 129
        V118
        C76 116 74 112 74 107
        Z
      "
      fill="#081D33"
      stroke="url(#neonBlue)"
      stroke-width="3"
      stroke-linejoin="round"
    />

    <circle class="chat-dot-1" cx="91" cy="95" r="3" fill="#61D8FF"/>
    <circle class="chat-dot-2" cx="100" cy="95" r="3" fill="#61D8FF"/>
    <circle class="chat-dot-3" cx="109" cy="95" r="3" fill="#61D8FF"/>
  </g>

  <!-- tiny HUD nodes -->
  <g fill="#53C8FF">
    <circle cx="100" cy="16" r="1.6"/>
    <circle cx="100" cy="184" r="1.6"/>
    <circle cx="16" cy="100" r="1.6"/>
    <circle cx="184" cy="100" r="1.6"/>
  </g>
</svg>
