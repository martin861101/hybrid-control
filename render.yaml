services:
  - type: web
    name: hybrid-control-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build:backend
    startCommand: npm run start:backend
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: AI_MODEL
        value: gemini-3.1-flash-lite
      - key: RESEND_FROM
        value: leads@notify.hybridcontrol.co.za
      - key: ALLOWED_ORIGINS
        value: https://hybridcontrol.co.za,https://www.hybridcontrol.co.za
